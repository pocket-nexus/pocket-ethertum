[package]
name = "pocket-ethertum-vita"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Pocket Ethertum on PS Vita: Ethertum's voxel world through GXM"

# Vita-only binary built through cargo-vita (tools/vita.ts); excluded from the desktop workspace in the
# repository root.
[workspace]
resolver = "2"

[dependencies]
pocketjs-vita = { path = "../vendor/pocketjs/hosts/vita", default-features = false }
pocket-vita-gxm = { path = "../vendor/pocketjs/devices/vita/pocket-vita-gxm", features = ["runtime-compiler"] }
pocket3d-title = { path = "../vendor/pocketjs/engine/pocket3d/crates/pocket3d-title" }
ether-voxel = { path = "../crates/ether-voxel" }
ether-world = { path = "../crates/ether-world" }
ether-sim = { path = "../crates/ether-sim" }
ether-pack = { path = "../crates/ether-pack" }
ether-look = { path = "../crates/ether-look" }
ether-mod = { path = "../crates/ether-mod" }
# The interface (ui/): its protocol, the flow, and the channel the PocketJS guest opens in the process.
ether-interface = { path = "../crates/ether-interface", features = ["guest"] }
# The guest's collector is run by this runtime, at moments it chooses (`interface.rs`).
libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b" }
serde_json = "1"
libm = "0.2"

[target.'cfg(target_os = "vita")'.dependencies]
vita2d-sys = "0.1.1"
vitasdk-sys = { version = "0.3.3", features = ["SceGxm_stub", "SceKernelThreadMgr_stub", "SceLibKernel_stub", "ScePower_stub", "SceCtrl_stub", "SceDisplay_stub"] }

[features]
default = ["usb-debug"]
usb-debug = ["pocketjs-vita/usb-debug"]

[package.metadata.vita]
title_id = "PKET00001"
title_name = "Pocket Ethertum"
build_std = "std,panic_abort"

[package.metadata.vita.profile.release]
strip_symbols = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 2
